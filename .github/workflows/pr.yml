name: PR Gate

on:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift Version
        run: swift --version

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Build
        run: swift build 2>&1

      - name: Test
        run: swift test --parallel 2>&1

      - name: Check for Secrets
        run: |
          if grep -r "password\|token\|privateKey\|secret\|apiKey" --include="*.swift" --include="*.json" --include="*.plist" . | grep -v "Tests/" | grep -v "TestSupport" | grep -v "Mock"; then
            echo "WARNING: Potential secrets found in source"
            exit 1
          fi

      - name: Check SwiftFormat
        run: |
          if command -v swiftformat &> /dev/null; then
            swiftformat --lint . 2>&1 || true
          fi

      - name: Verify Build Artifacts
        run: |
          bash build.sh
          test -f .build/VanguardNodeMac.app/Contents/MacOS/VanguardNodeMac
          test -f .build/VanguardConsoleMac.app/Contents/MacOS/VanguardConsoleMac
          echo "Build artifacts verified"

      - name: Check Package Dependencies
        run: swift package show-dependencies 2>&1

      - name: Validate Protocol Compliance
        run: |
          echo "Checking for stub implementations..."
          if grep -r "fatalError\|preconditionFailure\|TODO\|FIXME\|HACK" --include="*.swift" Packages/ | grep -v "Tests/" | grep -v "TestSupport" | grep -v "Mock" | grep -v "SKILL.md"; then
            echo "WARNING: Found stubs or TODOs in production code"
          fi
